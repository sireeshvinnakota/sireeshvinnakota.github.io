<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC 2026 — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pitch:#0D3D2B;--pitch-mid:#112E1F;--pitch-lt:#1A4A35;
  --gold:#E8C84A;--gold-dim:#C4A830;--white:#F5F5F0;
  --muted:#8AA89A;--text:#E8E4DC;
  --border:rgba(255,255,255,0.09);--stripe:rgba(255,255,255,0.025);
  --radius:6px;
  --silver:#C0C8D0;--bronze:#CD8B5A;
}
body{background:var(--pitch);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(90deg,var(--stripe) 0,var(--stripe) 1px,transparent 1px,transparent 80px);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 20px 80px}

header{text-align:center;padding:52px 0 36px;border-bottom:1px solid var(--border);margin-bottom:36px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,8vw,72px);line-height:.9;color:var(--white);letter-spacing:.02em;margin-bottom:14px}
h1 span{color:var(--gold)}
h1 a{color:inherit;text-decoration:none}
.subtitle{font-size:13px;color:var(--muted);line-height:1.6}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:10px}
.back-link{color:var(--muted);font-size:13px;text-decoration:none;transition:color .15s}
.back-link:hover{color:var(--gold)}
.right-controls{display:flex;align-items:center;gap:10px}
.last-updated{font-size:11px;color:var(--muted)}
.btn-sm{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:5px 14px;cursor:pointer;transition:all .15s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}

/* ── Participant count line ── */
.participant-line{font-size:12px;color:var(--muted);margin-bottom:24px;text-align:center}
.participant-line strong{color:var(--white)}

/* ── Trophy case ── */
.trophy-heading{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;
}
.trophy-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  gap:10px;margin-bottom:36px;
}
.trophy-card{
  background:var(--pitch-mid);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 12px;text-align:center;
}
.trophy-card.overall{
  border-color:rgba(232,200,74,0.5);background:var(--pitch-lt);
  grid-column:1 / -1;
}
.trophy-icon{font-size:24px;margin-bottom:6px;line-height:1}
.trophy-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.trophy-winner{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--white);line-height:1.15}
.trophy-winner.tbd{color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;font-weight:500}
.trophy-points{font-size:11px;color:var(--gold);margin-top:4px}

/* ── Leaderboard table ── */
.lb-table{width:100%;border-collapse:collapse}

.lb-row{
  display:grid;
  grid-template-columns:44px 1fr 80px;
  align-items:center;
  padding:0 4px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  min-height:54px;
  transition:background .12s;
}
.lb-row:hover{background:rgba(255,255,255,0.03)}
.lb-row:last-child{border-bottom:none}
.lb-row.header-row{
  min-height:32px;
  border-bottom:1px solid var(--border);
  margin-bottom:2px;
}
.lb-row.header-row .col{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Rank column */
.col-rank{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  color:var(--muted);
  line-height:1;
  padding-left:4px;
}
.col-rank.r1{color:var(--gold)}
.col-rank.r2{color:var(--silver)}
.col-rank.r3{color:var(--bronze)}

/* Medal emoji for top 3 */
.medal{font-size:16px;margin-right:2px}

/* Name column */
.col-name{padding:0 8px}
.name-main{font-size:14px;font-weight:600;color:var(--white)}

/* Score */
.col-correct{
  text-align:center;
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;
  color:var(--white);
  line-height:1;
}
.col-correct.leading{color:var(--gold)}
.col-correct.negative{color:#ff8a8a}

/* Tie indicator */
.tie-badge{
  font-size:9px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);background:rgba(255,255,255,0.06);
  border:1px solid var(--border);border-radius:3px;
  padding:1px 5px;margin-left:6px;vertical-align:middle;
}

/* Empty / loading */
.loading-wrap,.empty-state{text-align:center;padding:80px 20px;color:var(--muted)}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state a{color:var(--gold)}
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">USA &middot; Canada &middot; Mexico</p>
    <h1><a href="index.html">WORLD CUP <span>2026</span><br>LEADERBOARD</a></h1>
    <p class="subtitle">Group: 1 pt &middot; R32: 5 pts &middot; R16: 10 pts &middot; QF: 20 pts &middot; SF: 40 pts &middot; 3rd Place: 40 pts <span style="opacity:.65">(per correct pick)</span><br>Championship: wager-based &mdash; win doubles it, lose forfeits it</p>
  </header>

  <div class="top-bar">
    <a href="index.html" class="back-link">⌂ Home</a>
    <div class="right-controls">
      <a href="standings.html" class="btn-sm">📊 Predictions</a>
      <span class="last-updated" id="last-updated">Loading&hellip;</span>
      <button class="btn-sm" onclick="loadData()">&circlearrowleft; Refresh</button>
    </div>
  </div>

  <p class="participant-line" id="participant-line" style="display:none"></p>
  <div id="trophy-case" style="display:none">
    <p class="trophy-heading">🏆 Round Trophies</p>
    <div class="trophy-grid" id="trophy-grid"></div>
  </div>
  <div id="main-content">
    <div class="loading-wrap"><div class="spinner"></div><p>Loading leaderboard&hellip;</p></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhHQXLs3Kc2CHcumQS1cIqlHv8pO9MWsRlxSJYQL0-YItD4qnfX9gCtO_c2CQBkqeR/exec";
const TOTAL_MATCHES = 72; // 12 groups × 6 matches each

// Knockout stage registry — same shape as knockouts.html / Apps Script STAGES
const KO_STAGES = [
  { key:'r32',   short:'R32',   getAction:'getR32',   picksField:'r32picks',   resultsField:'r32results',   dataField:'r32data',   points:5  },
  { key:'r16',   short:'R16',   getAction:'getR16',   picksField:'r16picks',   resultsField:'r16results',   dataField:'r16data',   points:10 },
  { key:'qf',    short:'QF',    getAction:'getQF',    picksField:'qfpicks',    resultsField:'qfresults',    dataField:'qfdata',    points:20 },
  { key:'sf',    short:'SF',    getAction:'getSF',    picksField:'sfpicks',    resultsField:'sfresults',    dataField:'sfdata',    points:40 },
  { key:'final', short:'Final', getAction:'getFinal', picksField:'finalpicks', resultsField:'finalresults', dataField:'finaldata', points:80 },
];

async function loadData() {
  document.getElementById('last-updated').textContent = 'Refreshing\u2026';
  try {
    const requests = [fetch(APPS_SCRIPT_URL + '?action=get', { cache: 'no-store' })]
      .concat(KO_STAGES.map(s => fetch(APPS_SCRIPT_URL + '?action=' + s.getAction, { cache: 'no-store' })));

    const responses = await Promise.all(requests);
    const jGroups = await responses[0].json();
    const koJson = {};
    for (let i = 0; i < KO_STAGES.length; i++) {
      koJson[KO_STAGES[i].key] = await responses[i + 1].json();
    }

    render(jGroups.data || [], jGroups.results || {}, koJson);
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('main-content').innerHTML =
      '<div class="empty-state"><p>Could not load data. Check your connection and try refreshing.</p></div>';
    document.getElementById('last-updated').textContent = 'Error';
  }
}

// A match in the Final tab is the 3rd Place game if its id/slot mentions
// "3rd" or "third" (case-insensitive) — mirrors Code.gs isThirdPlaceRow.
// Everything else in the Final stage is the Championship match (wager-eligible).
function isThirdPlaceMatch(m) {
  const t = (String(m.id || '') + ' ' + String(m.slot || '')).toLowerCase();
  return t.indexOf('3rd') !== -1 || t.indexOf('third') !== -1;
}

// Round trophies: one per stage, excluding the Final (per design, the Final/
// 3rd Place round doesn't get its own trophy — only Overall Leader covers it).
const TROPHY_STAGES = [
  { key: 'group', label: 'Group Stage' },
  { key: 'r32',   label: 'Round of 32' },
  { key: 'r16',   label: 'Round of 16' },
  { key: 'qf',    label: 'Quarterfinals' },
  { key: 'sf',    label: 'Semifinals' },
];

function render(data, results, koJson) {
  const decidedCount = Object.keys(results).filter(k => results[k]).length;

  if (!data.length) {
    document.getElementById('main-content').innerHTML =
      '<div class="empty-state"><p>No predictions yet. <a href="knockouts.html?mode=new">Be the first!</a></p></div>';
    return;
  }

  // Build per-stage picks lookup by name, plus per-stage match->points maps
  const koByName = {};      // key -> {name: picks}
  const koPointsMap = {};   // key -> {matchId: points}
  const koWagerByName = {}; // final wager per name
  const koDecided = {};     // key -> decided match count

  KO_STAGES.forEach(s => {
    const j = koJson[s.key] || {};
    const stageData = j[s.dataField] || [];
    const stageMatches = j.matches || [];
    const stageResults = j[s.resultsField] || {};

    const lookup = {};
    stageData.forEach(p => {
      lookup[p.name] = p[s.picksField] || {};
      if (s.key === 'final') koWagerByName[p.name] = Number(p.finalwager || 0);
    });
    koByName[s.key] = lookup;

    const pointsMap = {};
    stageMatches.forEach(m => { pointsMap[m.id] = Number(m.points || s.points); });
    koPointsMap[s.key] = pointsMap;

    koDecided[s.key] = Object.keys(stageResults).filter(k => stageResults[k] && stageResults[k] !== 'IP').length;
  });

  // ── Score each participant ──
  const scored = data.map(p => {
    let groupCorrect = 0;
    const picks = p.picks || {};
    Object.entries(results).forEach(([key, winner]) => {
      if (winner && picks[key] === winner) groupCorrect++;
    });
    const groupPoints = groupCorrect; // 1 pt each

    const stagePointsMap = { group: groupPoints }; // for trophy lookup
    let koScore = 0;

    KO_STAGES.forEach(s => {
      const j = koJson[s.key] || {};
      const stageResults = j[s.resultsField] || {};
      const stageMatches = j.matches || [];
      const pointsMap = koPointsMap[s.key] || {};
      const stagePicks = (koByName[s.key] || {})[p.name] || {};

      if (s.key === 'final') {
        // 3rd Place: scored flat, like any other round
        const tpMatches = stageMatches.filter(isThirdPlaceMatch);
        let tpPoints = 0;
        tpMatches.forEach(m => {
          const winner = stageResults[m.id];
          if (winner && winner !== 'IP' && stagePicks[m.id] === winner) {
            tpPoints += pointsMap[m.id] || 40;
          }
        });

        // Championship: wager-based. Win doubles the wager; lose forfeits
        // (subtracts) the wagered points. No wager placed = no effect.
        const champMatches = stageMatches.filter(m => !isThirdPlaceMatch(m));
        const wager = Number(koWagerByName[p.name] || 0);
        let champPoints = 0;
        champMatches.forEach(m => {
          const winner = stageResults[m.id];
          if (winner && winner !== 'IP') {
            champPoints += (stagePicks[m.id] === winner) ? (2 * wager) : -wager;
          }
        });

        koScore += tpPoints + champPoints;
      } else {
        let pts = 0;
        Object.entries(stageResults).forEach(([key, winner]) => {
          if (winner && winner !== 'IP' && stagePicks[key] === winner) {
            pts += pointsMap[key] || s.points;
          }
        });
        stagePointsMap[s.key] = pts;
        koScore += pts;
      }
    });

    const totalScore = groupPoints + koScore;
    return { name: p.name, totalScore, stagePointsMap };
  });

  // Sort: by totalScore desc, then by name asc for ties
  scored.sort((a, b) => b.totalScore - a.totalScore || a.name.localeCompare(b.name));

  // Assign ranks (ties share rank)
  let rank = 1;
  scored.forEach((p, i) => {
    if (i > 0 && p.totalScore < scored[i-1].totalScore) rank = i + 1;
    p.rank = rank;
  });

  const leader = scored[0].totalScore;

  // ── Participant count line ──
  const pLine = document.getElementById('participant-line');
  pLine.style.display = 'block';
  pLine.innerHTML = '<strong>' + data.length + '</strong> participants &middot; <strong>' + decidedCount + '</strong> / ' + TOTAL_MATCHES + ' group matches decided';

  // ── Trophy case ──
  const tCase = document.getElementById('trophy-case');
  tCase.style.display = 'block';
  const tGrid = document.getElementById('trophy-grid');

  let trophyHtml = '';
  TROPHY_STAGES.forEach(t => {
    const decided = t.key === 'group' ? decidedCount : (koDecided[t.key] || 0);
    const withPoints = scored.map(p => ({ name: p.name, points: p.stagePointsMap[t.key] || 0 }));
    const max = Math.max(0, ...withPoints.map(w => w.points));
    const winners = (decided > 0 && max > 0) ? withPoints.filter(w => w.points === max).map(w => w.name) : [];

    const winnerHtml = winners.length
      ? '<div class="trophy-winner">' + winners.map(esc).map(n => n.split(' ')[0]).join(', ') + '</div>'
        + '<div class="trophy-points">' + max + ' pts</div>'
      : '<div class="trophy-winner tbd">No results yet</div>';

    trophyHtml += '<div class="trophy-card">'
      + '<div class="trophy-icon">🏆</div>'
      + '<div class="trophy-label">' + esc(t.label) + '</div>'
      + winnerHtml
      + '</div>';
  });

  const topTied = scored.filter(p => p.totalScore === leader);
  const overallWinnerHtml = '<div class="trophy-winner">' + topTied.map(p => esc(p.name)).join(', ') + '</div>'
    + '<div class="trophy-points">' + leader + ' pts</div>';

  trophyHtml += '<div class="trophy-card overall">'
    + '<div class="trophy-icon">👑</div>'
    + '<div class="trophy-label">Overall Leader</div>'
    + overallWinnerHtml
    + '</div>';

  tGrid.innerHTML = trophyHtml;

  // ── Build simplified rows: rank, name, score ──
  const medals = ['🥇','🥈','🥉'];
  let html = '<div class="lb-row header-row">'
    + '<div class="col col-rank">#</div>'
    + '<div class="col col-name">Name</div>'
    + '<div class="col col-correct" style="text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:Inter">Score</div>'
    + '</div>';

  scored.forEach(p => {
    const medal = p.rank <= 3 ? '<span class="medal">' + medals[p.rank-1] + '</span>' : '';
    const tieBadge = scored.filter(q => q.totalScore === p.totalScore).length > 1
      ? '<span class="tie-badge">TIE</span>' : '';
    const scoreCls = (p.rank === 1 ? ' leading' : '') + (p.totalScore < 0 ? ' negative' : '');

    html += '<div class="lb-row">'
      + '<div class="col-rank' + (p.rank <= 3 ? ' r' + p.rank : '') + '">' + medal + (p.rank > 3 ? p.rank : '') + '</div>'
      + '<div class="col-name"><div class="name-main">' + esc(p.name) + tieBadge + '</div></div>'
      + '<div class="col-correct' + scoreCls + '">' + p.totalScore + '</div>'
      + '</div>';
  });

  document.getElementById('main-content').innerHTML = html;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

loadData();
</script>
</body>
</html>
